filters:
  - filter_type: file
    file_format: XLIFF_ID_BASED
    source_language: zh_CN
    source_file: 'ChineseSimplified.xlf'
    translation_files_expression: '<lang>.xlf'

settings:
  pr_branch_name: tx_translations_<br_unique_id>
  language_mapping:
    zh_CN: ChineseSimplified
    zh_TW: TraditionalChinese
    en: English
    ja: Japanese
    ko: Korean
    fr: French
    de: German
